# Render blueprint: https://render.com/deploy?repo=https://github.com/thanvanthat/Gilli
# One web service builds the Dockerfile (website + C# multiplayer server) and serves it over https/wss.
services:
  - type: web
    name: gilli
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1   # rooms live in server memory: keep a single instance
